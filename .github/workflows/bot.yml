name: X bot

# One post/day: the pillar rotates by UTC weekday (gold, hashweight, silver,
# cash, cocaine, pu238 — see scripts/bot/config.json `rotation`), Sunday off.
# The caption stays link-free (cheap) unless BTC's day-over-day move clears
# `linkThresholdPct` — X bills a post containing a URL at ~13x a plain post.
# run.ts fires once dailyUtcHour has passed and today's pillar hasn't posted
# yet; GitHub often delays scheduled runs 1–4h, so a +4h catch-up cron covers
# a missed primary run within slotCatchupHours (6h).
# Cron times are UTC (dailyUtcHour=0 ~= 8p ET, evening crypto-scroll window
# per scripts/bot/config.json `_dailyUtcHourDoc` — not yet verified against
# this account's own engagement data).
on:
  schedule:
    - cron: '0 0 * * *' # primary   (~8p ET)
    - cron: '0 4 * * *' # catch-up  (~midnight ET)
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot id to run (blank = auto by today's weekday rotation)"
        type: string
        default: ''
      dry_run:
        description: 'Compose + render, but do not post'
        type: boolean
        default: true

# Only one bot run at a time so concurrent runs never race the state file.
concurrency:
  group: x-bot
  cancel-in-progress: false

permissions:
  contents: write # commit data/bot-state.json back

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run bot
        env:
          SITE_BASE_URL: https://bitcoinweighin.com
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.slot }}" ]; then ARGS="$ARGS --slot=${{ github.event.inputs.slot }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "run.ts$ARGS"
          npm run bot -- $ARGS

      - name: Commit state
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bot-state.json
          git diff --cached --quiet || git commit -m "chore(bot): state $(date -u +%Y-%m-%dT%H:%MZ)"
          # Push with rebase-and-retry. The bot's concurrency group serialises
          # bot-vs-bot, but not bot-vs-daily-update or bot-vs-manual pushes —
          # those races would otherwise silently drop the bot-state commit
          # and re-post the same slot next cron.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt rejected — fetching and rebasing"
            git fetch origin main
            git rebase origin/main || {
              echo "::error::Rebase conflict on attempt $attempt — aborting"
              git rebase --abort || true
              exit 1
            }
            sleep $((attempt * 3))
          done
          echo "::error::Push failed after 5 attempts"
          exit 1
