name: X bot

# First-reply A/B test: all commodity slots post daily (rotation="*"),
# one per cron invocation (pickSlot returns the next unposted slot for
# today). Cron fires 6 times/day spaced ~4 hours apart to cover up
# to 6 slots, with run.ts gracefully exiting if all slots are done.
# slotCatchupHours=23 covers the full day so late GitHub Actions runners
# still pick up missed slots. Cost: ~22c/post (2c main + 20c first-reply).
# At 5-6 posts/day this burns through ~$5.68 remaining X API credit in
# ~5 days, giving an A/B comparison of the first-reply link tactic.
# After credits are exhausted, migrate to OpenTweet ($11.99/mo).
# Cron times are UTC. Sunday off (rotation[0] = null).
on:
  schedule:
    - cron: '0 0 * * 1-6'  # 00:00 UTC Mon-Sat
    - cron: '0 4 * * 1-6'  # 04:00 UTC
    - cron: '0 8 * * 1-6'  # 08:00 UTC
    - cron: '0 12 * * 1-6' # 12:00 UTC
    - cron: '0 16 * * 1-6' # 16:00 UTC
    - cron: '0 20 * * 1-6' # 20:00 UTC
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot id to run (blank = auto by today's weekday rotation)"
        type: string
        default: ''
      dry_run:
        description: 'Compose + render, but do not post'
        type: boolean
        default: true

# Only one bot run at a time so concurrent runs never race the state file.
concurrency:
  group: x-bot
  cancel-in-progress: false

permissions:
  contents: write # commit data/bot-state.json back

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run bot
        env:
          SITE_BASE_URL: https://bitcoinweighin.com
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.slot }}" ]; then ARGS="$ARGS --slot=${{ github.event.inputs.slot }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "run.ts$ARGS"
          npm run bot -- $ARGS

      - name: Commit state
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bot-state.json
          git diff --cached --quiet || git commit -m "chore(bot): state $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt rejected — fetching and rebasing"
            git fetch origin main
            git rebase origin/main || {
              echo "::error::Rebase conflict on attempt $attempt — aborting"
              git rebase --abort || true
              exit 1
            }
            sleep $((attempt * 3))
          done
          echo "::error::Push failed after 5 attempts"
          exit 1
